[package]
name = "ppocr-burn-bench"
version = "0.1.0"
edition = "2024"
publish = false

[features]
autotune = ["burn/autotune"]

[dependencies]
anyhow = "1.0"
burn = { version = "=0.21.0", default-features = false, features = ["std", "metal", "fusion"] }
burn-store = { version = "=0.21.0", default-features = false, features = ["std", "burnpack"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
serde_json = "1.0"

[build-dependencies]
burn-onnx = "=0.21.0"
