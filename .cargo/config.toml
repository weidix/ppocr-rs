[target.'cfg(target_arch = "x86_64")']
# x86-64 CPU backends dispatch AVX2/FMA kernels. Compiling the surrounding Rust
# code for the same x86-64-v3 ISA lets LLVM vectorize packing, tensor, and
# post-processing loops on every x86_64 platform without tying builds to one CPU.
rustflags = ["-C", "target-cpu=x86-64-v3"]
