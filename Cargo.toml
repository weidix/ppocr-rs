[package]
name = "ppocr-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[features]
default = ["cpu"]

# Direct PP-OCRv6 Safetensors inference through native CPU kernels or WGPU.
cpu = ["dep:rayon", "dep:safetensors"]
# Compile-time operator timing for the native CPU backend. Normal inference
# contains no profiling branch or logging.
cpu-profile = ["cpu"]
gpu = ["dep:safetensors", "dep:wgpu"]

[dependencies]
anyhow = "1.0"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
rayon = { version = "1.11", optional = true }
safetensors = { version = "=0.7.0", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["std", "wgsl", "vulkan"] }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "ppocr-cpu-bench"
path = "src/bin/ppocr-cpu-bench.rs"
required-features = ["cpu"]

[[bin]]
name = "ppocr-gpu-bench"
path = "src/bin/ppocr-gpu-bench.rs"
required-features = ["gpu"]
