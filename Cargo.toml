[package]
name = "ppocr-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
candle-core = { version = "0.10.0", features = ["metal"] }
candle-nn = { version = "0.10.0", features = ["metal"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
