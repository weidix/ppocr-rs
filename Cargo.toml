[package]
name = "ppocr-rs"
version = "0.1.0"
edition = "2024"
description = "Native PP-OCRv6 inference with CPU and WGPU backends"
license = "MIT OR Apache-2.0"
repository = "https://github.com/weidix/ppocr-rs"
keywords = ["ocr", "pp-ocr", "computer-vision"]
categories = ["computer-vision", "science"]
autobins = false
default-run = "ppocr"

[features]
default = ["cpu"]

# Direct PP-OCRv6 Safetensors inference through native CPU kernels or WGPU.
cpu = ["dep:rayon", "dep:safetensors"]
# Compile-time operator timing for the native CPU backend. Normal inference
# contains no profiling branch or logging.
cpu-profile = ["cpu"]
gpu = ["dep:safetensors", "dep:wgpu"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }
rayon = { version = "1.11", optional = true }
safetensors = { version = "=0.7.0", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["std", "wgsl", "vulkan"] }

[profile.release]
# Optimize deployed OCR binaries for sustained inference throughput and size.
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
strip = "symbols"

[profile.bench]
# Keep benchmark binaries comparable to release builds while retaining enough
# debug information for profilers to attribute samples to source locations.
inherits = "release"
debug = "line-tables-only"
strip = "none"

[[bin]]
name = "ppocr"
path = "src/bin/ppocr.rs"

[[bin]]
name = "ppocr-cpu-bench"
path = "src/bin/ppocr-cpu-bench.rs"
required-features = ["cpu"]

[[bin]]
name = "ppocr-gpu-bench"
path = "src/bin/ppocr-gpu-bench.rs"
required-features = ["gpu"]
